- id: C6
  section: 2. What Was Known
  text: ImpossibleBench gave models tasks whose tests contradict the specification,
    so any pass is a cheat. The right prompt cut GPT-5's cheating on one benchmark
    from ninety-two percent to one; hiding the tests took cheating on another near
    zero, at a cost in performance.
  kind: reported
  note: Zhong et al., 2025
  sources:
